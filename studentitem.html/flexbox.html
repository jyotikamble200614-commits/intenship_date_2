<!DOCTYPE html>
<html>
<head>
  <style>
    .main {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      height: 200px;
      border: 2px solid white;
    }

    .box {
      width: 80px;
      height: 80px;
      background-color:white;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="main">
    <div class="box">html</div>
    <div class="box">css</div>
    <div class="box">javascript</div>
  </div>

</body>
</html>
