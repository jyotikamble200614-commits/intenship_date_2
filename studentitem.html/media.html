<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Navbar</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
    }

    /* Navbar */
    .navbar {
      background-color: #333;
      padding: 15px;
    }

    .nav-links {
      display: flex;
      justify-content: right;
      list-style: none;
    }

    .nav-links li {
      margin: 0 15px;
    }

    .nav-links a {
      color: lightblue;
      text-decoration: none;
      font-size: 18px;
    }

    .nav-links a:hover {
      color: red;
    }

    /* Media Query for Mobile */
    @media (max-width: 768px) {
      .nav-links {
        flex-direction: column;
        align-items: center;
      }

      .nav-links li {
        margin: 10px 0;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

</body>
</html>
